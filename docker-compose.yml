services:
  fomo-sentinel:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - sentinel-data:/data
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sentinel-data:

