[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fomo-sentinel"
version = "0.1.0"
description = "24/7 multi-chain meme-coin scanner with Slack alerts"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "httpx[socks]>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[project.scripts]
fomo-sentinel = "fomo_sentinel.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/fomo_sentinel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
